name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev
      - name: Scan tracked files for credential patterns
        shell: bash
        run: |
          if git grep -nE 'ntn_[A-Za-z0-9]{10,}|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|secret_[A-Za-z0-9]{10,}'; then
            echo 'Potential credential pattern found'
            exit 1
          fi
